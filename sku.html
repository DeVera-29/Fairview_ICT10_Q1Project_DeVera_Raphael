<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>SKU Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 3rem auto;
            padding: 0 1rem;
            color: #2b2b2b;
            line-height: 1.5;
        }
        nav {
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        nav a {
            color: #6b4f3a;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        form {
            background: #faf8f5;
            border: 1px solid #e5ddd3;
            border-radius: 10px;
            padding: 1.5rem;
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border: 1px solid #d8cfc2;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
        }
        input[type="button"] {
            margin-top: 0.5rem;
            background: #6b4f3a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background: #57402f;
        }
        #sku_result {
            margin-top: 1rem;
            background: #faf8f5;
            border: 1px solid #e5ddd3;
            border-radius: 10px;
            padding: 1rem 1.5rem;
        }
    </style>
</head>
<body>
    
    <nav>
        <a href="./index.html">Receipt Generator</a> | 
        <a href="./sku.html"><strong>SKU Generator</strong></a>
    </nav>
    <hr>

    <py-script src="sku.py"></py-script>

    <h1>SKU Generator</h1>
    <form>
        <label for="category">Category:</label><br>
        <select id="category">
            <option value="STR">Strings</option>
            <option value="PIC">Picks</option>
            <option value="ACC">Accessories</option>
            <option value="TOO">Tools</option>
        </select>
        <br><br>

        <label for="prod_name">Product Name:</label><br>
        <input id="prod_name" type="text" placeholder="Ex. truss rod">
        <br><br>

        <label for="stock_qty">Stock Quantity:</label><br>
        <input id="stock_qty" type="number" placeholder="Ex. 10">
        <br><br>

        <input type="button" value="Generate SKU" py-click="generate_sku">
    </form>
    

    <br><br>
    <p>GENERATED SKU:</p>
    <div id="sku_result">Your SKU will appear here</div>
</body>
</html>
