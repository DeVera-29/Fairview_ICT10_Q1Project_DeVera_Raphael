<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Untitled Guitar Store - Receipt</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 3rem auto;
            padding: 0 1rem;
            color: #2b2b2b;
            line-height: 1.5;
        }
        nav {
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        nav a {
            color: #6b4f3a;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        form {
            background: #faf8f5;
            border: 1px solid #e5ddd3;
            border-radius: 10px;
            padding: 1.5rem;
        }
        form h2 {
            margin-top: 0;
            font-size: 1.1rem;
        }
        label {
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        br {
            content: "";
            display: block;
            margin: 0.6rem 0;
        }
        input[type="button"] {
            margin-top: 1rem;
            background: #6b4f3a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background: #57402f;
        }
        #receipt {
            margin-top: 1rem;
            background: #faf8f5;
            border: 1px solid #e5ddd3;
            border-radius: 10px;
            padding: 1rem 1.5rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="./index.html"><strong>Receipt Generator</strong></a> | 
        <a href="./sku.html">SKU Generator</a>
    </nav>
    <hr>

    <py-script src="main.py"></py-script>

    <h1>Welcome to Untitled Guitar Store!</h1>
    <form>
        <h2>Menu</h2>
        <input id="item1" type="checkbox" value="540">
        <label for="item1"> Elixir Acoustic Strings</label> 
        <br>
        <input id="item2" type="checkbox" value="200">
        <label for="item2"> Dunlop Guitar Picks (pack of 6)</label> 
        <br>
        <input id="item3" type="checkbox" value="1000">
        <label for="item3"> Fender Guitar Strap</label> 
        <br>
        <input id="item4" type="checkbox" value="560">
        <label for="item4"> Daddario Guitar Tuner</label> 
        <br>
        <input id="item5" type="checkbox" value="2100">
        <label for="item5">truss rod</label> 
        <br>
        <input type="button" value="calculate total" py-click="calculate_total">
    </form>

    <br><br>
    <p>RECEIPT:</p>
    <div id="receipt"></div>
</body>
</html>
